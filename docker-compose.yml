version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nuliz
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  php:
    build:
      context: ./laravel
      dockerfile: ../docker/php/Dockerfile
    image: nuliz_php
    volumes:
      - ./laravel:/var/www/html
    depends_on:
      - mysql
    environment:
      COMPOSER_ALLOW_SUPERUSER: '1'
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8000:80" # Laravel served on port 8000
    volumes:
      - ./laravel:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network

  next:
    build:
      context: ./nextjs
      dockerfile: ../docker/next/Dockerfile
    image: nuliz_next
    volumes:
      - ./nextjs:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - php
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
